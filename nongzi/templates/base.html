<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}丰收农资店管理系统{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    {% block head_extra %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/"><i class="fas fa-seedling me-1"></i>丰收农资</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/sales/pos"><i class="fas fa-cash-register me-1"></i>开单</a></li>
        <li class="nav-item"><a class="nav-link" href="/products"><i class="fas fa-boxes me-1"></i>商品</a></li>
        <li class="nav-item"><a class="nav-link" href="/purchases"><i class="fas fa-truck-loading me-1"></i>进货</a></li>
        <li class="nav-item"><a class="nav-link" href="/inventory"><i class="fas fa-warehouse me-1"></i>库存</a></li>
        <li class="nav-item"><a class="nav-link" href="/contacts/suppliers"><i class="fas fa-address-book me-1"></i>往来</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">更多</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="/sales">销售记录</a></li>
            <li><a class="dropdown-item" href="/reports/purchase-ledger"><i class="fas fa-file-excel me-1"></i>进货台账</a></li>
            <li><a class="dropdown-item" href="/reports/sales-ledger"><i class="fas fa-file-excel me-1"></i>销售台账</a></li>
            <li><a class="dropdown-item" href="/trace"><i class="fas fa-search-location me-1"></i>追溯查询</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="/finance">财务</a></li>
            <li><a class="dropdown-item" href="/reports">报表</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="/system">系统设置</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid mt-3">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/static/js/utils.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
