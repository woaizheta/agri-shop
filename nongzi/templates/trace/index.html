{% extends "base.html" %}
{% block title %}追溯查询 - 丰收农资{% endblock %}
{% block content %}
<div class="row"><div class="col-lg-6 mx-auto">
<h4 class="mb-3"><i class="fas fa-search-location me-2"></i>追溯查询</h4>
<div class="card mb-3"><div class="card-header fw-bold">正向追溯（批号 → 去向）</div><div class="card-body"><form method="get" action="/trace/batch" class="d-flex gap-2"><input class="form-control" name="batch_no" placeholder="输入批号..." required><button class="btn btn-success"><i class="fas fa-search"></i> 查询</button></form></div></div>
<div class="card"><div class="card-header fw-bold">反向追溯（销售单 → 来源）</div><div class="card-body"><form method="get" action="/trace/sale" class="d-flex gap-2"><input class="form-control" name="order_no" placeholder="输入销售单号..." required><button class="btn btn-success"><i class="fas fa-search"></i> 查询</button></form></div></div>
</div></div>
{% endblock %}
