{% extends "base.html" %}
{% block title %}{% if customer %}编辑客户{% else %}新增客户{% endif %} - 丰收农资{% endblock %}
{% block content %}
<div class="row"><div class="col-lg-6 mx-auto">
<h4 class="mb-3">{% if customer %}编辑客户{% else %}新增客户{% endif %}</h4>
<form method="post" action="{% if customer %}/contacts/customers/{{ customer.id }}{% else %}/contacts/customers{% endif %}">
<div class="card"><div class="card-body row g-3">
<div class="col-md-6"><label class="form-label">姓名 <span class="text-danger">*</span></label><input class="form-control" name="name" value="{{ customer.name if customer else '' }}" required></div>
<div class="col-md-6"><label class="form-label">电话 <span class="text-danger">*</span></label><input class="form-control" name="phone" value="{{ customer.phone if customer else '' }}" required></div>
<div class="col-md-6"><label class="form-label">身份证号</label><input class="form-control" name="id_card" value="{{ customer.id_card if customer else '' }}"></div>
<div class="col-md-6"><label class="form-label">标签</label><select class="form-select" name="tag"><option value="farmer" {% if customer and customer.tag == 'farmer' %}selected{% endif %}>散户</option><option value="major_farmer" {% if customer and customer.tag == 'major_farmer' %}selected{% endif %}>种植大户</option><option value="cooperative" {% if customer and customer.tag == 'cooperative' %}selected{% endif %}>合作社</option></select></div>
<div class="col-12"><label class="form-label">地址</label><input class="form-control" name="address" value="{{ customer.address if customer else '' }}"></div>
<div class="col-md-6"><label class="form-label">种植作物</label><input class="form-control" name="crops" value="{{ customer.crops if customer else '' }}"></div>
<div class="col-md-6"><label class="form-label">种植面积（亩）</label><input class="form-control" type="number" step="0.1" name="farm_area" value="{{ customer.farm_area if customer else '' }}"></div>
</div></div>
<div class="mt-3"><button type="submit" class="btn btn-success"><i class="fas fa-save me-1"></i>保存</button> <a href="/contacts/customers" class="btn btn-outline-secondary">取消</a></div>
</form>
</div></div>
{% endblock %}
