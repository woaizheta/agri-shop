{% extends "base.html" %}
{% block title %}{% if supplier %}编辑供应商{% else %}新增供应商{% endif %} - 丰收农资{% endblock %}
{% block content %}
<div class="row"><div class="col-lg-6 mx-auto">
<h4 class="mb-3">{% if supplier %}编辑供应商{% else %}新增供应商{% endif %}</h4>
<form method="post" action="{% if supplier %}/contacts/suppliers/{{ supplier.id }}{% else %}/contacts/suppliers{% endif %}">
<div class="card"><div class="card-body row g-3">
<div class="col-12"><label class="form-label">名称 <span class="text-danger">*</span></label><input class="form-control" name="name" value="{{ supplier.name if supplier else '' }}" required></div>
<div class="col-md-6"><label class="form-label">统一社会信用代码</label><input class="form-control" name="credit_code" value="{{ supplier.credit_code if supplier else '' }}"></div>
<div class="col-md-6"><label class="form-label">农药经营许可证号</label><input class="form-control" name="pesticide_lic_no" value="{{ supplier.pesticide_lic_no if supplier else '' }}"></div>
<div class="col-md-6"><label class="form-label">联系人</label><input class="form-control" name="contact" value="{{ supplier.contact if supplier else '' }}"></div>
<div class="col-md-6"><label class="form-label">电话</label><input class="form-control" name="phone" value="{{ supplier.phone if supplier else '' }}"></div>
<div class="col-12"><label class="form-label">地址</label><input class="form-control" name="address" value="{{ supplier.address if supplier else '' }}"></div>
<div class="col-12"><label class="form-label">备注</label><textarea class="form-control" name="note" rows="2">{{ supplier.note if supplier else '' }}</textarea></div>
</div></div>
<div class="mt-3"><button type="submit" class="btn btn-success"><i class="fas fa-save me-1"></i>保存</button> <a href="/contacts/suppliers" class="btn btn-outline-secondary">取消</a></div>
</form>
</div></div>
{% endblock %}
