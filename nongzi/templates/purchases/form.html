{% extends "base.html" %}
{% block title %}新增进货单 - 丰收农资{% endblock %}
{% block head_extra %}<style>.product-search-results { max-height:200px; overflow-y:auto; position:absolute; z-index:1000; width:100%; background:#fff; border:1px solid #dee2e6; border-radius:0 0 4px 4px; }</style>{% endblock %}
{% block content %}
<div class="row"><div class="col-12">
<h4 class="mb-3"><i class="fas fa-truck-loading me-2"></i>新增进货单</h4>
<form method="post" action="/purchases" id="purchaseForm" onsubmit="return checkForm()">
<div class="card mb-3"><div class="card-body row g-3">
<div class="col-md-3"><label class="form-label">供应商<span class="text-danger">*</span></label><select class="form-select" name="supplier_id" required><option value="">-- 请选择 --</option>{% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></div>
<div class="col-md-3"><label class="form-label">日期</label><input class="form-control" type="date" name="order_date" value="{{ today }}" required></div>
<div class="col-md-6"><label class="form-label">备注</label><input class="form-control" name="note" placeholder="可选"></div>
</div></div>
<div class="card mb-3"><div class="card-header d-flex justify-content-between align-items-center"><span class="fw-bold">商品明细</span><button type="button" class="btn btn-sm btn-outline-success" onclick="addRow()"><i class="fas fa-plus"></i> 添加行</button></div>
<div class="table-responsive"><table class="table table-hover mb-0" id="itemsTable"><thead class="table-light"><tr><th width="30%">商品</th><th width="10%">数量</th><th width="10%">单价</th><th width="10%">金额</th><th width="10%" class="text-danger">批号 *</th><th width="12%">生产日期</th><th width="12%">有效期至</th><th width="6%"></th></tr></thead><tbody></tbody><tfoot class="table-light"><tr><td colspan="5" class="fw-bold">合计：</td><td colspan="3"><span id="totalAmount" class="fw-bold text-danger">0.00</span></td></tr></tfoot></table></div>
</div>
<div class="d-flex gap-2"><button type="submit" class="btn btn-success"><i class="fas fa-save me-1"></i>保存入库</button><a href="/purchases" class="btn btn-outline-secondary">取消</a></div>
</form>
</div></div>
{% endblock %}
{% block scripts %}
<script>
let rowIdx = 0;
function addRow() { rowIdx++;
    var tr = document.createElement("tr"); tr.id = "row-" + rowIdx;
    tr.innerHTML = '<td><div class="position-relative"><input type="hidden" name="product_id" value=""><input class="form-control product-search" data-row="' + rowIdx + '" placeholder="搜索商品..." autocomplete="off"><div class="product-search-results list-group" id="res-' + rowIdx + '" style="display:none"></div></div></td>' +
        '<td><input class="form-control" type="number" step="any" name="quantity" value="1" onchange="calc(' + rowIdx + ')"></td>' +
        '<td><input class="form-control" type="number" step="0.01" name="unit_price" value="0" onchange="calc(' + rowIdx + ')"></td>' +
        '<td><span class="form-control-plaintext" id="amt-' + rowIdx + '">0.00</span></td>' +
        '<td><input class="form-control" name="batch_no" placeholder="必填"></td>' +
        '<td><input class="form-control" type="date" name="prod_date"></td>' +
        '<td><input class="form-control" type="date" name="expiry_date"></td>' +
        '<td><button type="button" class="btn btn-sm btn-outline-danger" onclick="delRow(' + rowIdx + ')"><i class="fas fa-times"></i></button></td>';
    document.getElementById("itemsTable").querySelector("tbody").appendChild(tr); init(rowIdx);
}
function delRow(i) { var r = document.getElementById("row-" + i); if (r) r.remove(); calcAll(); }
var timer;
function init(i) {
    var inp = document.querySelector("#row-" + i + " .product-search");
    var res = document.getElementById("res-" + i);
    if (!inp || !res) return;
    inp.addEventListener("input", function() { clearTimeout(timer); var q = this.value.trim();
        if (q.length < 1) { res.style.display = "none"; return; }
        timer = setTimeout(function() { fetch("/products/search?q=" + encodeURIComponent(q)).then(function(r) { return r.json(); }).then(function(data) { res.innerHTML = "";
            if (data.length === 0) { res.style.display = "none"; return; }
            data.forEach(function(p) { var a = document.createElement("a"); a.className = "list-group-item list-group-item-action py-1 small"; a.href = "#";
                a.textContent = p.code + " " + p.name + (p.spec ? " " + p.spec : "") + " | ￥" + p.retailPrice + " | 库存:" + p.stock;
                a.onclick = function(e) { e.preventDefault(); inp.value = p.name; inp.parentNode.querySelector("input[name=product_id]").value = p.id;
                    document.querySelector("#row-" + i + ' [name=unit_price]').value = p.retailPrice; calc(i); res.style.display = "none"; };
                res.appendChild(a);
            }); res.style.display = "block";
        }).catch(function() { res.style.display = "none"; });
    }, 300); });
    document.addEventListener("click", function(e) { if (!inp.contains(e.target) && !res.contains(e.target)) res.style.display = "none"; });
}
function calc(i) { var q = parseFloat(document.querySelector("#row-" + i + ' [name=quantity]').value) || 0; var p = parseFloat(document.querySelector("#row-" + i + ' [name=unit_price]').value) || 0; var a = document.getElementById("amt-" + i); if (a) a.textContent = (q * p).toFixed(2); calcAll(); }
function calcAll() { var t = 0; document.querySelectorAll("#itemsTable tbody tr").forEach(function(r) { var c = r.querySelectorAll("td"); t += parseFloat(c[3].textContent) || 0; }); document.getElementById("totalAmount").textContent = t.toFixed(2); }
addRow();
function checkForm() {
    var rows = document.querySelectorAll("#itemsTable tbody tr");
    var hasItem = false;
    for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var pid = r.querySelector("input[name=product_id]");
        if (!pid || !pid.value) continue;
        hasItem = true;
        var bn = r.querySelector("input[name=batch_no]");
        var qty = r.querySelector("input[name=quantity]");
        var price = r.querySelector("input[name=unit_price]");
        if (!qty || !qty.value || parseFloat(qty.value) <= 0) {
            alert("第 " + (i + 1) + " 行数量未填写或为0！");
            if (qty) qty.focus();
            return false;
        }
        if (!price || !price.value || parseFloat(price.value) <= 0) {
            alert("第 " + (i + 1) + " 行单价未填写或为0！");
            if (price) price.focus();
            return false;
        }
        if (!bn || !bn.value.trim()) {
            alert("第 " + (i + 1) + " 行批号未填写！");
            bn.focus();
            return false;
        }
    }
    if (!hasItem) {
        alert("请至少搜索并选择一个商品！");
        return false;
    }
    return true;
}
</script>
{% endblock %}
