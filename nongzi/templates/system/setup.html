<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>欢迎使用 - 丰收农资店管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #198754 0%, #0d6efd 100%); min-height: 100vh; }
        .setup-card { max-width: 550px; margin: 5vh auto; }
    </style>
</head>
<body>
<div class="container">
<div class="card setup-card shadow-lg">
    <div class="card-body p-4">
        <div class="text-center mb-4">
            <i class="fas fa-store fa-3x text-success mb-2"></i>
            <h3>欢迎使用丰收农资店管理系统</h3>
            <p class="text-muted">请完成首次配置，开始使用</p>
        </div>

        <form id="setupForm">
            <h5 class="mb-3"><i class="fas fa-store me-1"></i>店铺信息</h5>
            <div class="mb-2">
                <label class="form-label">店铺名称 <span class="text-danger">*</span></label>
                <input class="form-control" name="store_name" value="{{ store_name }}" required>
            </div>
            <div class="mb-2">
                <label class="form-label">地址</label>
                <input class="form-control" name="store_address" value="{{ store_address }}">
            </div>
            <div class="mb-2">
                <label class="form-label">电话</label>
                <input class="form-control" name="store_phone" value="{{ store_phone }}">
            </div>

            <hr>
            <h5 class="mb-3"><i class="fas fa-database me-1"></i>初始化选项</h5>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="loadDemo" checked>
                <label class="form-check-label" for="loadDemo">
                    <strong>导入演示数据</strong>
                    <br><small class="text-muted">预置商品、供应商、客户和示例交易记录，方便快速了解系统功能</small>
                </label>
            </div>

            <button type="submit" class="btn btn-success btn-lg w-100" id="startBtn">
                <i class="fas fa-rocket me-1"></i>开始使用
            </button>
        </form>

        <div id="setupMsg" class="mt-3"></div>
    </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById("setupForm").addEventListener("submit", function(e) {
    e.preventDefault();
    var btn = document.getElementById("startBtn");
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>初始化中...';

    var fd = new FormData();
    fd.append("store_name", this.store_name.value);
    fd.append("store_address", this.store_address.value);
    fd.append("store_phone", this.store_phone.value);
    fd.append("load_demo", document.getElementById("loadDemo").checked ? "1" : "0");

    fetch("/api/setup/init", { method: "POST", body: fd })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.success) {
                document.getElementById("setupMsg").innerHTML = '<div class="alert alert-success">' + d.message + ' 正在跳转...</div>';
                setTimeout(function() { window.location.href = "/"; }, 1000);
            } else {
                document.getElementById("setupMsg").innerHTML = '<div class="alert alert-danger">' + d.message + '</div>';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-rocket me-1"></i>开始使用';
            }
        })
        .catch(function() {
            document.getElementById("setupMsg").innerHTML = '<div class="alert alert-danger">初始化失败，请重试</div>';
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-rocket me-1"></i>开始使用';
        });
});
</script>
</body>
</html>
