{% extends "base.html" %}
{% block title %}应收账款 - 丰收农资{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
<h4><i class="fas fa-hand-holding-usd me-2"></i>应收账款</h4>
<div class="d-flex gap-2">
<ul class="nav nav-tabs"><li class="nav-item"><a class="nav-link active" href="/finance/ar">应收</a></li><li class="nav-item"><a class="nav-link" href="/finance/ap">应付</a></li><li class="nav-item"><a class="nav-link" href="/finance/expenses">费用</a></li><li class="nav-item"><a class="nav-link" href="/finance/profit">利润</a></li></ul>
<form class="d-flex" method="get"><input class="form-control ms-2" name="search" value="{{ search }}" placeholder="搜索客户"><button class="btn btn-outline-success ms-1"><i class="fas fa-search"></i></button></form>
</div></div>
<div class="card">
<div class="card-body p-2">
<button class="btn btn-success btn-sm mb-2" data-bs-toggle="modal" data-bs-target="#repayModal"><i class="fas fa-plus me-1"></i>录入还款</button>
<div class="table-responsive small"><table class="table table-hover table-sm mb-0"><thead class="table-light"><tr><th>客户</th><th>本期赊销</th><th>本期还款</th><th>当前余额</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{ r.customer.name }}</td><td class="">{{ r.credit_sales|currency }}</td><td class="">{{ r.repayments|currency }}</td><td class="{% if r.balance > 0 %}text-danger fw-bold{% endif %}">{{ r.balance|currency }}</td></tr>{% endfor %}</tbody></table></div>
</div></div>

<div class="modal fade" id="repayModal"><div class="modal-dialog"><div class="modal-content"><form method="post" action="/finance/repay">
<div class="modal-header"><h5>录入还款</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body">
<div class="mb-3"><label class="form-label">客户</label><select class="form-select" name="customer_id" required><option value="">-- 请选择 --</option>{% for r in rows %}<option value="{{ r.customer.id }}">{{ r.customer.name }} (欠款 {{ r.balance|currency }})</option>{% endfor %}</select></div>
<div class="mb-3"><label class="form-label">还款金额</label><input class="form-control" type="number" step="0.01" name="amount" required></div>
<div class="mb-3"><label class="form-label">备注</label><input class="form-control" name="note"></div>
</div><div class="modal-footer"><button type="submit" class="btn btn-success">确认还款</button></div>
</form></div></div></div>
{% endblock %}
