{% extends "base.html" %}
{% block title %}应付账款 - 丰收农资{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
<h4><i class="fas fa-money-check-alt me-2"></i>应付账款</h4>
<div class="d-flex gap-2">
<ul class="nav nav-tabs"><li class="nav-item"><a class="nav-link" href="/finance/ar">应收</a></li><li class="nav-item"><a class="nav-link active" href="/finance/ap">应付</a></li><li class="nav-item"><a class="nav-link" href="/finance/expenses">费用</a></li><li class="nav-item"><a class="nav-link" href="/finance/profit">利润</a></li></ul>
</div></div>
<div class="card">
<div class="card-body p-2">
<button class="btn btn-warning btn-sm mb-2" data-bs-toggle="modal" data-bs-target="#payModal"><i class="fas fa-plus me-1"></i>录入付款</button>
<div class="table-responsive small"><table class="table table-hover table-sm mb-0"><thead class="table-light"><tr><th>供应商</th><th>本期进货应付</th><th>本期付款</th><th>余额</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{ r.supplier.name }}</td><td>{{ r.purchases|currency }}</td><td>{{ r.payments|currency }}</td><td class="{% if r.balance > 0 %}text-danger fw-bold{% endif %}">{{ r.balance|currency }}</td></tr>{% endfor %}</tbody></table></div>
</div></div>

<div class="modal fade" id="payModal"><div class="modal-dialog modal-lg"><div class="modal-content"><form method="post" action="/finance/pay">
<div class="modal-header"><h5>录入付款</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body">
<div class="mb-3"><label class="form-label">供应商</label><select class="form-select" id="paySupplier" name="supplier_id" required onchange="loadUnpaidPOs()"><option value="">-- 请选择 --</option>{% for r in rows %}<option value="{{ r.supplier.id }}">{{ r.supplier.name }} (应付 {{ r.balance|currency }})</option>{% endfor %}</select></div>
<div class="mb-3" id="unpaidPOSection" style="display:none">
  <label class="form-label">待付款订单 <small class="text-muted">(默认全选，可取消勾选)</small></label>
  <div id="unpaidPOList" class="list-group mb-2" style="max-height:200px;overflow-y:auto"></div>
  <input type="hidden" name="purchase_order_ids" id="purchaseOrderIds" value="">
</div>
<div class="mb-3"><label class="form-label">付款金额 <span class="text-danger">*</span></label><input class="form-control" type="number" step="0.01" name="amount" id="payAmount" required></div>
<div class="mb-3"><label class="form-label">备注</label><input class="form-control" name="note"></div>
</div><div class="modal-footer"><button type="submit" class="btn btn-success">确认付款</button></div>
</form></div></div></div>

<script>
function loadUnpaidPOs(){
    var sid = document.getElementById('paySupplier').value;
    var sec = document.getElementById('unpaidPOSection');
    var list = document.getElementById('unpaidPOList');
    if(!sid){ sec.style.display='none'; return; }
    fetch('/finance/api/unpaid-purchases?supplier_id='+sid)
        .then(r=>r.json()).then(data=>{
            list.innerHTML='';
            if(data.length===0){ list.innerHTML='<div class="text-muted small p-2">该供应商无未付订单</div>'; sec.style.display='block'; return; }
            data.forEach(function(o){
                var div=document.createElement('div');
                div.className='list-group-item py-1 d-flex justify-content-between align-items-center';
                div.innerHTML='<span><code>'+o.order_no+'</code> '+o.date+' <span class="text-danger">'+o.amount.toFixed(2)+'</span></span>'+
                    '<div class="form-check"><input class="form-check-input po-check" type="checkbox" value="'+o.id+'" onchange="updatePOIds()" checked></div>';
                list.appendChild(div);
            });
            sec.style.display='block';
            updatePOIds();
        });
}
function updatePOIds(){
    var ids=[]; var total=0;
    document.querySelectorAll('.po-check:checked').forEach(function(cb){
        ids.push(cb.value);
        var amtEl=cb.closest('.list-group-item').querySelector('.text-danger');
        if(amtEl) total+=parseFloat(amtEl.textContent);
    });
    document.getElementById('purchaseOrderIds').value=ids.join(',');
    if(ids.length>0) document.getElementById('payAmount').value=total.toFixed(2);
}
</script>
{% endblock %}
